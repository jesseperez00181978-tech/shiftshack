<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    input, button, select {
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .row {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .actions button {
      width: auto;
      flex: 1;
    }

    .Applied { color: blue; }
    .Interview { color: orange; }
    .Hired { color: green; }
    .Rejected { color: red; }
  </style>
</head>
<body>

  <h1>ShiftStack 💼</h1>

  <div class="row">
    <input id="jobInput" placeholder="Company name" />
    <select id="statusInput">
      <option>Applied</option>
      <option>Interview</option>
      <option>Hired</option>
      <option>Rejected</option>
    </select>
    <input id="searchInput" placeholder="Search jobs" oninput="renderJobs()" />
    <button onclick="addJob()">Add Job</button>
  </div>

  <ul id="jobList"></ul>

  <script>
    let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

    function saveJobs() {
      localStorage.setItem("jobs", JSON.stringify(jobs));
    }

    function renderJobs() {
      let list = document.getElementById("jobList");
      let search = document.getElementById("searchInput").value.toLowerCase().trim();
      list.innerHTML = "";

      jobs.forEach((job, index) => {
        if (
          search &&
          !job.name.toLowerCase().includes(search) &&
          !job.status.toLowerCase().includes(search)
        ) {
          return;
        }

        let li = document.createElement("li");

        li.innerHTML = `
          <div><strong>${job.name}</strong></div>
          <div class="${job.status}">${job.status}</div>
          <div>${job.date}</div>
        `;

        let actions = document.createElement("div");
        actions.className = "actions";

        let statusBtn = document.createElement("button");
        statusBtn.textContent = "Change Status";
        statusBtn.onclick = () => changeStatus(index);

        let editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.onclick = () => editJob(index);

        let deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteJob(index);

        actions.appendChild(statusBtn);
        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(actions);
        list.appendChild(li);
      });
    }

    function addJob() {
      let input = document.getElementById("jobInput");
      let statusInput = document.getElementById("statusInput");

      if (!input.value.trim()) return;

      jobs.unshift({
        name: input.value.trim(),
        status: statusInput.value,
        date: new Date().toLocaleDateString()
      });

      input.value = "";
      statusInput.value = "Applied";
      saveJobs();
      renderJobs();
    }

    function editJob(index) {
      let newName = prompt("Edit company name:", jobs[index].name);
      if (!newName || !newName.trim()) return;

      jobs[index].name = newName.trim();
      saveJobs();
      renderJobs();
    }

    function deleteJob(index) {
      jobs.splice(index, 1);
      saveJobs();
      renderJobs();
    }

    function changeStatus(index) {
      const order = ["Applied", "Interview", "Hired", "Rejected"];
      let current = jobs[index].status;
      let next = order[(order.indexOf(current) + 1) % order.length];
      jobs[index].status = next;
      saveJobs();
      renderJobs();
    }

    renderJobs();
  </script>

</body>
</html>
