<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 { text-align: center; }

    .section { margin-bottom: 15px; }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      border: none;
      font-weight: bold;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
    }

    .job {
      background: white;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .offer {
      box-shadow: 0 0 25px rgba(0,255,0,0.4);
    }
  </style>
</head>

<body>

<h1>ShiftStack 💼</h1>

<button onclick="searchIndeed()">Find Jobs</button>
<button onclick="exportJobs()">Export Jobs</button>
<button onclick="backupJobs()">Backup Jobs</button>

<input id="jobInput" placeholder="Company name">
<select id="statusInput">
  <option>Applied</option>
  <option>Interview</option>
  <option>Offer</option>
  <option>Rejected</option>
</select>

<input id="followUpInput" type="date">

<input id="searchInput" placeholder="Search jobs" oninput="renderJobs()">

<button onclick="addJob()">Add Job</button>
<button onclick="clearJobs()">Clear All</button>

<div id="jobList"></div>

<script>
let jobs = JSON.parse(localStorage.getItem("jobs") || "[]");

function saveJobs() {
  localStorage.setItem("jobs", JSON.stringify(jobs));
}

function addJob() {
  const name = document.getElementById("jobInput").value.trim();
  const status = document.getElementById("statusInput").value;
  let followUp = document.getElementById("followUpInput").value;

  if (!name) return;

  if (!followUp) {
    const d = new Date();
    d.setDate(d.getDate() + 2);
    followUp = d.toISOString().split("T")[0];
  }

  jobs.unshift({
    name,
    status,
    date: new Date().toISOString().split("T")[0],
    followUp,
    notes: "",
    link: "",
    contacted: false
  });

  saveJobs();
  renderJobs();
}

function renderJobs() {
  const list = document.getElementById("jobList");
  list.innerHTML = "";

  const search = document.getElementById("searchInput").value.toLowerCase();

  jobs
    .filter(j => j.name.toLowerCase().includes(search))
    .forEach((job, index) => {

      const div = document.createElement("div");
      div.className = "job";

      if (job.status === "Offer") div.classList.add("offer");

      div.innerHTML = `
        <input value="${job.name}" onchange="updateName(${index}, this.value)">

        <select onchange="updateStatus(${index}, this.value)">
          <option ${job.status==="Applied"?"selected":""}>Applied</option>
          <option ${job.status==="Interview"?"selected":""}>Interview</option>
          <option ${job.status==="Offer"?"selected":""}>Offer</option>
          <option ${job.status==="Rejected"?"selected":""}>Rejected</option>
        </select>

        <input type="date" value="${job.followUp || ""}" onchange="updateFollowUp(${index}, this.value)">

        <textarea oninput="updateNotes(${index}, this.value)">${job.notes || ""}</textarea>

        <button onclick="deleteJob(${index})">Delete</button>
      `;

      list.appendChild(div);
    });
}

function updateName(i,v){ jobs[i].name=v; saveJobs(); }
function updateStatus(i,v){ jobs[i].status=v; saveJobs(); }
function updateFollowUp(i,v){ jobs[i].followUp=v; saveJobs(); }
function updateNotes(i,v){ jobs[i].notes=v; saveJobs(); }

function deleteJob(i){
  if(!confirm("Delete this job?")) return;
  jobs.splice(i,1);
  saveJobs();
  renderJobs();
}

function clearJobs(){
  if(!confirm("Clear all jobs?")) return;
  jobs=[];
  saveJobs();
  renderJobs();
}

function exportJobs(){
  const blob = new Blob([JSON.stringify(jobs)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shiftstack.json";
  a.click();
}

function backupJobs(){ exportJobs(); }

function searchIndeed(){
  const q = document.getElementById("jobInput").value || "jobs";
  window.open(`https://www.indeed.com/jobs?q=${encodeURIComponent(q)}`);
}

renderJobs();
</script>

</body>
</html>
