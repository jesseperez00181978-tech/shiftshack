in<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .container {
  max-width: 500px;
  margin: auto;
    }

.section {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      text-align: center;
    }
.job button {
  width: auto;
  margin-top: 10px;
}


.import-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #ddd;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
}


    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    } 

<input type="file" id="importFile" accept=".json,application/json" onchange="importJobs(event)" style="display:none;">
{
      background: white;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .job button {
      width: auto;
      margin-top: 10px;
    }
 textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px;
  margin-top: 6px;
  border-radius: 8px;
  box-sizing: border-box;
  resize: vertical;
 }
  </style>
</head>
<body>

  <h1>ShiftStack 💼</h1>
  <button onclick="searchIndeed()">Find Jobs</button>
<button id="exportBtn" onclick="exportJobs()">Export Jobs</button>
  <button onclick="backupJobs()">Backup Jobs</button>
  <label for="importFile" class="import-btn">Import Jobs</label>
<input type="file" id="importFile" onchange="importJobs(event)">
  <div id="stats" style="margin-bottom: 15px; font-weight: bold;"></div>

<div class="section">
  
  <input id="followUpInput" type="date">
</div>

<div class="section">
  <input id="jobInput" placeholder="Company name">
</div>
  

<div class="section">
  <select id="statusInput">
    <option>Applied</option>
    <option>Interview</option>
    <option>Offer</option>
    <option>Rejected</option>
  </select>
</div>
 <div class="section">
  <label>Follow-up date</label>
  <input id="followUpInput" type="date">
 </div>
  <input id="searchInput" placeholder="Search jobs" oninput="renderJobs()">
<select id="filterStatus" onchange="renderJobs()">
  
    <option value="All">All Statuses</option>
    <option value="Applied">Applied</option>
    <option value="Interview">Interview</option>
    <option value="Offer">Offer</option>
    <option value="Rejected">Rejected</option>
  </select>
<button onclick="addJob()">Add Job</button>
<button onclick="clearJobs()">Clear All</button>
  <p id="jobCount" style="font-size:14px;"></p>
  <div id="quickFilters" style="margin-bottom:10px;">
  <button id="filter-all" onclick="setQuickFilter('all')">All</button>
  <button id="filter-overdue" onclick="setQuickFilter('overdue')">Overdue</button>
  <button id="filter-today" onclick="setQuickFilter('today')">Today</button>
  <button id="filter-nolink" onclick="setQuickFilter('nolink')">No Link</button>
  </div>
  <div id="jobList"></div>

  <script>
    let jobs = [];

try {
  const stored = localStorage.getItem("jobs");
  jobs = stored ? JSON.parse(stored) : [];
} catch (e) {
  console.error("Corrupted storage. Resetting jobs.");
  jobs = [];
}
setTimeout(() => {
  document.querySelectorAll("input, select").forEach(el => {
    el.style.borderRadius = "10px";
    el.style.padding = "10px";
    el.style.marginBottom = "10px";
    el.style.border = "1px solid #ccc";
  });
}, 100);
    setTimeout(() => {
  document.querySelectorAll("button").forEach(btn => {
    btn.style.borderRadius = "10px";
    btn.style.padding = "10px";
    btn.style.fontWeight = "bold";
    btn.style.background = "linear-gradient(135deg, #4facfe, #00f2fe)";
    btn.style.color = "#fff";
    btn.style.border = "none";
    btn.style.boxShadow = "0 4px 10px rgba(0,0,0,0.2)";
    btn.style.transition = "0.2s";
    
    btn.onmouseover = () => {
      btn.style.transform = "scale(1.05)";
    };
    
    btn.onmouseout = () => {
      btn.style.transform = "scale(1)";
    };
  });
}, 100);
const statusColors = {
  Offer: "green",
  Interview: "orange",
  Rejected: "red",
  Applied: "blue"
};
let quickFilter = "all";

function setQuickFilter(filter) {
  quickFilter = filter;
  renderJobs();
}
   
    function saveJobs() {
  localStorage.setItem("jobs", JSON.stringify(jobs));
  renderJobs();
    }
function backupJobs() {
  const data = JSON.stringify(jobs);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "shiftstack-backup.json";
  a.click();

  URL.revokeObjectURL(url);
}
    function addJob() {
      const name = document.getElementById("jobInput").value.trim();
      const status = document.getElementById("statusInput").value;
      let followUp = document.getElementById("followUpInput").value;

if (!followUp) {
  const followUpDate = new Date();
  followUpDate.setDate(followUpDate.getDate() + 2);
  followUp = followUpDate.toISOString().split("T")[0];
}

      if (!name){return;}
document.getElementById("jobInput").value = "";
document.getElementById("followUpInput").value = "";
    const link = prompt("Paste job link (optional):") || "";
const today = new Date().toISOString().split("T")[0];




      jobs.unshift({
  name,  
 status: "Applied",
date: today,
followUp: followUp,
  notes: "",
  link    

});
saveJobs();

      document.getElementById("jobInput").value = "";
      document.getElementById("followUpInput").value = "";
      document.getElementById("statusInput").value = "Applied";
      

      
      renderJobs();
    
 
setTimeout(() => {
  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}, 100); 
    }
      function renderJobs() {
  const list = document.getElementById("jobList");
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  const filterStatus = document.getElementById("filterStatus").value;

  list.innerHTML = "";

  const priority = {
    Offer: 1,
    Interview: 2,
    Applied: 3,
    Rejected: 4
  };

  const today = new Date().toISOString().split("T")[0];

  const filteredJobs = jobs
    .filter(job => {
      const matchesSearch = job.name.toLowerCase().includes(search);
      const matchesStatus = filterStatus === "All" || job.status === filterStatus;
      

const isOverdue = job.followUp && job.followUp < today;
const isToday = job.followUp === today;
const noLink = !job.link;

let matchesQuick = true;

if (quickFilter === "overdue") matchesQuick = isOverdue;
else if (quickFilter === "today") matchesQuick = isToday;
else if (quickFilter === "nolink") matchesQuick = noLink;

return matchesSearch && matchesStatus && matchesQuick;
    })
    .sort((a, b) => {
      const aOverdue = a.followUp && a.followUp < today;
      const bOverdue = b.followUp && b.followUp < today;

      if (aOverdue && !bOverdue) return -1;
      if (!aOverdue && bOverdue) return 1;

      if (priority[a.status] !== priority[b.status]) {
        return priority[a.status] - priority[b.status];
      }

      return new Date(b.date) - new Date(a.date);
    });

  const countEl = document.getElementById("jobCount");
  if (countEl) countEl.textContent = "Total Jobs: " + jobs.length;

  const statsDiv = document.getElementById("stats");
  const total = jobs.length;
  const interviews = filteredJobs.filter(j => j.status === "Interview");
const offers = filteredJobs.filter(j => j.status === "Offer");
const rejected = filteredJobs.filter(j => j.status === "Rejected");

  statsDiv.innerHTML = `
  <div style="
    font-size:18px;
    font-weight:bold;
    margin:18px 0 12px 0;
    color: ${offers.length > 0 ? "green" : "#222"};
  ">
    Total: ${filteredJobs.length} | Interviews: ${interviews.length} | Offers: ${offers.length} | Rejected: ${rejected.length}
  </div>
`;
  filteredJobs.forEach((job, index) => {
    
      const isOverdue = job.followUp && job.followUp < today;
    const isToday = job.followUp === today;

    const div = document.createElement("div");
    div.style.transition = "all 0.25s ease";

div.onmouseover = () => {
  div.style.transform = "scale(1.02)";
  div.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
};

div.onmouseout = () => {
  div.style.transform = "scale(1)";
  div.style.boxShadow = "0 4px 10px rgba(0,0,0,0.1)";
};

div.style.borderRadius = "12px";
div.style.padding = "12px";
div.style.marginBottom = "10px";
    
div.style.boxShadow = "0 4px 10px rgba(0,0,0,0.1)";
div.style.transition = "all 0.25s ease";
div.style.background = "#ffffff";
    div.className = "job";
if (index === filteredJobs.length - 1) {
  div.style.outline = "2px solid cyan";
  setTimeout(() => {
    div.style.outline = "none";
  }, 2000);
}
    if (isOverdue) {
      div.style.backgroundColor = "#ffe5e5";
      div.style.borderLeft = "6px solid #ff4d4d";
    } else if (isToday) {
      div.style.backgroundColor = "#fff4cc";
      div.style.borderLeft = "6px solid #ffa500";
    } else {
      div.style.backgroundColor = "#ffffff";
      div.style.borderLeft = "6px solid #4CAF50";
    }

    if (job.status === "Applied") {
      div.style.borderLeft = "6px solid blue";
    } else if (job.status === "Interview") {
      div.style.borderLeft = "6px solid orange";
    } else if (job.status === "Offer") {
      div.style.borderLeft = "6px solid green";
      div.style.boxShadow = "0 4px 12px rgba(0,0,0,0.15)";
div.style.transition = "transform 0.2s ease, box-shadow 0.2s ease";
    } else if (job.status === "Rejected") {
      div.style.borderLeft = "6px solid red";
    }

    div.innerHTML = `
     ${isOverdue ? `
  <div style="
    background:red;
    color:white;
    padding:12px;
border-radius:12px;
margin-bottom:16px;
font-size:14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  border: 1px solid rgba(0,0,0,0.1);
  text-align:center;
  letter-spacing:1px;
">
    ⚠️ FOLLOW UP OVERDUE
  </div>
` : isToday ? `
  <div style="
    background: linear-gradient(90deg, #ff9800, #ffb74d);
    color:white;
    padding:12px;
border-radius:12px;
margin-bottom:16px;
font-size:14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  border: 1px solid rgba(0,0,0,0.1);text-align:center;
  text-align:center;
  letter-spacing:1px;
  ">
    ⏰ FOLLOW UP TODAY
  </div>
` : ""}
      <input value="${job.name}" onchange="updateName(${index}, this.value)" />

      <div>Status:</div>
      <select onchange="updateStatus(${index}, this.value)">
        <option value="Applied" ${job.status === "Applied" ? "selected" : ""}>Applied</option>
        <option value="Interview" ${job.status === "Interview" ? "selected" : ""}>Interview</option>
        <option value="Offer" ${job.status === "Offer" ? "selected" : ""}>Offer</option>
        <option value="Rejected" ${job.status === "Rejected" ? "selected" : ""}>Rejected</option>
      </select>
<div style="
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  margin:6px 0;
  color:white;
  

background: ${statusColors[job.status] || "gray"};
">
  ${job.status}
</div>
      <div>Applied: ${job.date}</div>
      ${job.lastContacted ? `<div>Last Contacted: ${job.lastContacted}</div>` : ""}
      <label>Follow up:</label>
      
      <input type="date" value="${job.followUp || ""}" onchange="updateFollowUp(${index}, this.value)">

    <div>
  ${job.link && job.link.startsWith("http")
    ? `<a href="${job.link}" target="_blank">Open Job</a>`
    : `<span style="color:gray;font-size:14px;">No link saved</span>`
  }
</div>

<input 
  placeholder="Paste job link..."
  value="${job.link || ""}"
  oninput="updateLink(${index}, this.value)"
  style="margin-top:6px;"
/>
    ${job.link ? `<div style="margin-top:6px; color:#007BFF; font-weight:bold; cursor:pointer;" onclick="openLink('${job.link}')">
🔗 Open Link
</div>` : ""} 
      ${isOverdue ? '<div style="color:red">(Overdue)</div>' : isToday ? '<div style="color:orange">(Today)</div>' : ""}

      <div>Notes:</div>
      <textarea oninput="updateNotes(${index}, this.value)">${job.notes || ""}</textarea>
      ${job.lastUpdated ? `<div style="font-size:12px; color:gray;">Updated: ${job.lastUpdated}</div>` : ''}
      <button onclick="editLink(${index})">Edit Link</button>
      <button onclick="deleteJob(${index})">Delete</button>
   <button onclick="markContacted(${index})">Contacted Today</button>
    `;



    list.appendChild(div);
 div.scrollIntoView({ behavior: "smooth" }); 
  });
        }
     
    

  function updateLink(index, value) {
  jobs[index].link = value;
  saveJobs();
  }
function editLink(index) {
  const newLink = prompt("Edit job link:", jobs[index].link || "");

  if (newLink !== null) {
    jobs[index].link = newLink;
    jobs[index].lastUpdated = new Date().toLocaleTimeString();
    saveJobs();
    renderJobs();
  }
}
    function updateStatus(index, value) {
      jobs[index].status = value;
      jobs[index].lastUpdated = new Date().toLocaleTimeString();
      saveJobs();
      renderJobs();
    }

    function updateName(index, newName) {
      jobs[index].name = newName;
      jobs[index].lastUpdated = new Date().toLocaleTimeString();
      saveJobs();
      renderJobs();
    }
function updateNotes(index, value) {
  jobs[index].notes = value;
  
jobs[index].lastUpdated = new Date().toLocaleTimeString();
  localStorage.setItem("jobs", JSON.stringify(jobs));
}
  

    function updateFollowUp(index, value) {
  jobs[index].followUp = value;
  jobs[index].lastUpdated = new Date().toLocaleTimeString();
  saveJobs();
  renderJobs();
    }
  function openLink(url) {
  if (!url) return;

  let formatted = url;
  if (!url.startsWith("http")) {
    formatted = "https://" + url;
  }

  window.open(formatted, "_blank");
  }    
  function markContacted(index) {
  const today = new Date();
  const formattedToday = today.toISOString().split("T")[0];

  const nextFollowUp = new Date();
  nextFollowUp.setDate(today.getDate() + 3);
  const formattedNext = nextFollowUp.toISOString().split("T")[0];

  jobs[index].lastContacted = formattedToday;
  jobs[index].followUp = formattedNext;

  saveJobs();
  renderJobs();
  }
    
function exportJobs() {
  const raw = localStorage.getItem("jobs");

  if (!raw || raw === "[]") {
    alert("No jobs to export");
    return;
  }

  const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(raw);

  const a = document.createElement("a");
  a.href = dataUri;
  a.download = "jobs.json";

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

    function updateName(index, newName) {
  jobs[index].name = newName;
  saveJobs();
  renderJobs();
}
function searchIndeed() {
  const query = document.getElementById("jobInput").value || "jobs";
  const url = `https://www.indeed.com/jobs?q=${encodeURIComponent(query)}`;
  window.open(url, "_blank");
   
} 

    
    

    function deleteJob(index) {
      if (!confirm("Delete this job?")) return;
      jobs.splice(index, 1);
      saveJobs();
      renderJobs();
    }
function clearJobs() {
  if (!confirm("Delete ALL jobs?")) return;
  jobs = [];
  saveJobs();
  renderJobs();
}
    document.getElementById("searchInput").addEventListener("input", renderJobs);
    document.getElementById("filterStatus").addEventListener("change", renderJobs);

    renderJobs();
    function importJobs(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      jobs = JSON.parse(e.target.result);
      saveJobs();
      renderJobs();
    } catch {
      alert("Invalid file");
    }
  };

  reader.readAsText(file);
    }
  </script>
</body>
</html>
