 <!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 18px;
    }

    h1 {
      text-align: center;
      color: #00f2fe;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .job {
      background: #1c1c1c;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
    }

    .blue { border-left: 6px solid #4facfe; }
    .orange { border-left: 6px solid orange; }
    .green { border-left: 6px solid #00c853; }
    .red { border-left: 6px solid red; }

    .job-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .job-actions button {
      flex: 1;
      font-size: 14px;
    }

    .edit-btn { background: #2ecc71; }
    .notes-btn { background: #1e90ff; }
    .delete-btn { background: #8b0000; }

    label.import {
      display: block;
      background: #333;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      margin: 8px 0;
    }

    #importFile {
      display: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 0, 0, 0.6); }
      50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(255, 0, 0, 0.9); }
      100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 0, 0, 0.6); }
    }

    .pulse {
      animation: pulse 1.2s infinite;
    }

    .light-mode {
      background: #f5f5f5;
      color: #000;
    }

    .light-mode .green,
    .light-mode .orange,
    .light-mode .red,
    .light-mode .blue,
    .light-mode .job {
      background: #ffffff;
      color: #000;
    }

    .light-mode .job h3,
    .light-mode .job p {
      color: #000;
    }

    .light-mode .import {
      background: #ddd;
      color: #000;
    }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 15px 0;
}

.stat-card {
  background: #ffffff;
  color: #222;
  padding: 14px 6px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.25);
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
}

.applied-stat { color: blue; }
.interview-stat { color: orange; }
.offer-stat { color: green; }
.rejected-stat { color: red; }

.stat-label {
  font-size: 14px;
  color: #555;
}
.filter-buttons {
  display: flex;
  gap: 10px;
  margin: 15px 0;
  flex-wrap: wrap;
}

.filter-buttons button {
  width: auto;
  padding: 10px 16px;
  background: #333;
  color: white;
}
.filter-buttons button.active-filter {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
}
  #jobCount {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 15px 0;
  color: white;
  }  
    #themeToggle {
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
.job-notes {
  margin-top: 8px;
  padding: 8px;
  background: #111;
  border-radius: 6px;
  color: #ddd;
  white-space: pre-wrap;
} 
  </style>
</head>

<body>

<h1>ShiftStack 💼</h1>

<button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>

<input id="jobInput" placeholder="Company name">
<input id="locationInput" placeholder="Location (example: Albuquerque, NM)">
<input id="jobNotes" placeholder="Notes (optional)">

<select id="statusInput">
  <option>Applied</option>
  <option>Interview</option>
  <option>Offer</option>
  <option>Hired</option>
  <option>Rejected</option>
</select>
<select id="priorityInput">
  <option>Low</option>
  <option selected>Medium</option>
  <option>High</option>
</select>
<input id="followUpInput" type="date">
<input id="jobSearchInput" placeholder="Search jobs...">

<button onclick="addJob()">Add Job</button>
<button onclick="openIndeed()">Search Indeed</button>
<button onclick="openCraigslist()">Search Craigslist</button>
<button onclick="testLocation()">📍 My Location</button>
 <button onclick="exportJobs()">💾 Backup Jobs</button>
<button onclick="showAbout()">ℹ️ About ShiftStack</button>
<button onclick="showPrivacy()">🔒 Privacy</button>
<label class="import" for="importFile">📂 Restore Backup</label>
<input type="file" id="importFile" onchange="importJobs(event)">
<div id="jobCount" onclick="showJobSummary()"></div>
  <div class="filter-buttons">
  <button onclick="setFilter('all')">All</button>
  <button onclick="setFilter('overdue')">Overdue</button>
  <button onclick="setFilter('today')">Today</button>
  <button onclick="setFilter('nolink')">No Link</button>
</div>
<div id="stats" class="job"></div>
<div id="list"></div>

<script>
let jobs = JSON.parse(localStorage.getItem("jobs") || "[]");
let currentFilter = "all";
function save() {
  localStorage.setItem("jobs", JSON.stringify(jobs));
}
function setFilter(filter) {
    currentFilter = filter;

    document.querySelectorAll(".filter-buttons button").forEach(btn => {
        btn.classList.remove("active-filter");
    });

    event.target.classList.add("active-filter");

    render();
}
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
const stats = document.getElementById("stats");

const total = jobs.length;
const applied = jobs.filter(job => job.status === "Applied").length;
const interview = jobs.filter(job => job.status === "Interview").length;
const offer = jobs.filter(job => job.status === "Offer").length;
const rejected = jobs.filter(job => job.status === "Rejected").length;

  
  document.getElementById("jobCount").innerText =
  "Total Jobs: " + jobs.length;

stats.innerHTML = `
<div class="stats-grid">

  <div class="stat-card" onclick="setFilter('applied')">
    <div class="stat-number applied-stat">${applied}</div>
    <div class="stat-label">Applied</div>
  </div>

  <div class="stat-card" onclick="setFilter('interview')">
    <div class="stat-number interview-stat">${interview}</div>
    <div class="stat-label">Interviews</div>
  </div>

  <div class="stat-card" onclick="setFilter('offer')">
    <div class="stat-number offer-stat">${offer}</div>
    <div class="stat-label">Offers</div>
  </div>

  <div class="stat-card" onclick="setFilter('rejected')">
    <div class="stat-number rejected-stat">${rejected}</div>
    <div class="stat-label">Rejected</div>
  </div>

</div>
`;
  const todayDate = new Date().toISOString().split("T")[0];

let filteredJobs = jobs.filter(job => {
  if (currentFilter === "all") return true;
  if (currentFilter === "overdue") return job.followUp && job.followUp < todayDate;
  if (currentFilter === "today") return job.followUp === todayDate;
  if (currentFilter === "nolink") return !job.link;
if (currentFilter === "applied")
  return job.status === "Applied";

if (currentFilter === "interview")
  return job.status === "Interview";

if (currentFilter === "offer")
  return job.status === "Offer";

if (currentFilter === "rejected")
  return job.status === "Rejected"; 
 return true;
});

filteredJobs.forEach((job, i) => {
    const div = document.createElement("div");
    div.className = "job";

    if (job.status === "Offer") div.classList.add("green");
    else if (job.status === "Interview") div.classList.add("orange");
    else if (job.status === "Rejected") div.classList.add("red");
    else div.classList.add("blue");

    div.innerHTML = `
      <h3>${job.name}</h3>
      ${job.location ? `<p>Location: ${job.location}</p>` : ""}
      <p>Status: ${job.status}</p>
    
    <p>
Priority:
<span style="font-weight:bold;color:${
job.priority === "High"
? "#ff4444"
: job.priority === "Medium"
? "#ffcc00"
: "#44aaff"
}">
${job.priority || "Medium"}
</span>
</p>
${job.followUp && job.followUp < todayDate ? `
<p style="color:#ff4444;font-weight:bold;">
⚠️ OVERDUE  ${
Math.floor(
(new Date(todayDate) - new Date(job.followUp)) /
(1000 * 60 * 60 * 24)
)
} days late
</p>
` : ''}   
 ${job.followUp === todayDate ? `
 <p style="color:#ffcc00;font-weight:bold;">
 🟡 DUE TODAY
 </p>
 ` : ''}
<p>Follow-up: ${job.followUp || "None"}</p>   
<button
style="background:black;color:white;width:100%;margin:10px 0;"
onclick="markContacted(${i})">
📞 Follow Up Now
</button>
<button
  style="background:#39d353;color:white;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;width:100%;margin:10px 0;"
  onclick="markContacted(${i})">
  🟢 Mark Contacted
</button>     
 <div class="job-notes">
  <strong>Notes:</strong> ${job.notes || "No notes"}
</div>    
      <div class="job-actions">
        <button class="edit-btn" onclick="editJob(${i})">Edit</button>
      <button class="priority-btn" onclick="editPriority(${i})">Priority</button>
        <button class="notes-btn" onclick="editNotes(${i})">Notes</button>
        <button class="delete-btn" onclick="deleteJob(${i})">Delete</button>
      </div>
    `;

    list.appendChild(div);
  });
}
function markContacted(i) {
  const today = new Date().toISOString().split("T")[0];

  jobs[i].lastContacted = today;

  const next = new Date();
  next.setDate(next.getDate() + 2);
  jobs[i].followUp = next.toISOString().split("T")[0];

  save();
  render();

  alert("✅ Marked contacted.\nNext follow-up: " + jobs[i].followUp);
}
function addJob() {
  const name = document.getElementById("jobInput").value.trim();
  const location = document.getElementById("locationInput").value.trim();
  const status = document.getElementById("statusInput").value;
 const priority = document.getElementById("priorityInput").value;
  let followUp = document.getElementById("followUpInput").value;
  const notes = document.getElementById("jobNotes").value;

  if (!name) return;

  if (!followUp) {
    const d = new Date();
    d.setDate(d.getDate() + 2);
    followUp = d.toISOString().split("T")[0];
  }

  jobs.unshift({
    name,
    location,
    status,
   priority,
    notes,
    followUp,
    link: ""
  });

  document.getElementById("jobInput").value = "";
  document.getElementById("locationInput").value = "";
  document.getElementById("jobNotes").value = "";
  document.getElementById("followUpInput").value = "";

  save();
  render();
}

function editJob(i) {
  const newName = prompt("Edit company name", jobs[i].name || "");
  if (newName === null) return;

  const newLocation = prompt("Edit location", jobs[i].location || "");
  if (newLocation === null) return;

  const newStatus = prompt(
    "Edit status: Applied, Interview, Offer, Hired, Rejected",
    jobs[i].status || "Applied"
  );
  if (newStatus === null) return;

  const newPriority = prompt(
    "Edit priority: Low, Medium, High",
    jobs[i].priority || "Medium"
  );
  if (newPriority === null) return;

  const newFollowUp = prompt(
    "Edit follow-up date YYYY-MM-DD",
    jobs[i].followUp || ""
  );
  if (newFollowUp === null) return;

  const newLink = prompt("Edit job link", jobs[i].link || "");
  if (newLink === null) return;

  const newNotes = prompt("Edit notes", jobs[i].notes || "");
  if (newNotes === null) return;

  jobs[i].name = newName.trim();
  jobs[i].location = newLocation.trim();
  jobs[i].status = newStatus.trim();
  jobs[i].priority = newPriority.trim();
  jobs[i].followUp = newFollowUp.trim();
  jobs[i].link = newLink.trim();
  jobs[i].notes = newNotes.trim();

  save();
  render();

  alert("✅ Job updated.");
}

function editNotes(i) {
  const v = prompt("Edit notes", jobs[i].notes || "");
  if (v !== null) {
    jobs[i].notes = v;
    save();
    render();
  }
}

function deleteJob(i) {
  if (!confirm("Delete job?")) return;
  jobs.splice(i, 1);
  save();
  render();
}
function showJobSummary() {
  const applied = jobs.filter(job => job.status === "Applied").length;
  const interviews = jobs.filter(job => job.status === "Interview").length;
  const offers = jobs.filter(job => job.status === "Offer").length;
  const rejected = jobs.filter(job => job.status === "Rejected").length;

  alert(
    "📊 Job Summary\n\n" +
    "Applied: " + applied + "\n" +
    "Interviews: " + interviews + "\n" +
    "Offers: " + offers + "\n" +
    "Rejected: " + rejected + "\n\n" +
    "Total Jobs: " + jobs.length
  );
}
function openIndeed() {
  const input =
    document.getElementById("searchInput") ||
    document.getElementById("jobSearchInput");

  const q = input ? input.value.trim() : "jobs";

  window.open(
    "https://www.indeed.com/jobs?q=" +
      encodeURIComponent(q || "jobs") +
      "&l=Albuquerque%2C%20NM",
    "_blank"
  );
}
function testLocation() {
  if (!navigator.geolocation) {
    alert("GPS is not supported on this device.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      alert("GPS works:\n" + lat + ", " + lon);
    },
    function(error) {
      alert("GPS failed: " + error.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}
function openCraigslist() {
  const q = document.getElementById("jobSearchInput").value || "";
  window.open(`https://albuquerque.craigslist.org/search/jjj?query=${encodeURIComponent(q)}`, "_blank");
}

function exportJobs() {
  const dataStr = JSON.stringify(jobs, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const a = document.createElement("a");

  const now = new Date();
  const date =
    now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");

  const time =
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0");

  a.href = URL.createObjectURL(blob);
  a.download = "ShiftStack_Backup_" + date + "_" + time + ".json";
  a.click();

  alert("✅ Backup saved!\n" + jobs.length + " jobs exported.");
}

function toggleTheme() {
  document.body.classList.toggle("light-mode");
}

function importJobs(e) {
if (!confirm("Restore this backup and replace current jobs?")) return;  
 const r = new FileReader();
  r.onload = ev => {
    jobs = JSON.parse(ev.target.result);
    save();
    render();
  };
  r.readAsText(e.target.files[0]);
}
function showAbout() {
  alert(
    "ShiftStack 💼\n\n" +
    "A simple job tracking app for applications, interviews, follow-ups, notes, and offers.\n\n" +
    "Version: 1.0\n" +
    "Built by Jesse Perez"
  );
}

function showPrivacy() {
  alert(
    "Privacy Notice 🔒\n\n" +
    "ShiftStack stores your job information only on this device using local storage.\n\n" +
    "No account required.\n" +
    "No data sold.\n" +
    "No tracking.\n" +
    "No server upload."
  );
}
render();
</script>

</body>
</html>
