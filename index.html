<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
    }

    .job {
      background: white;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .job button {
      width: auto;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>ShiftStack 💼</h1>
<div id="stats" style="margin-bottom: 15px; font-weight: bold;"></div>
<input id="jobInput" placeholder="Company name">

<select id="statusInput">
  <option>Applied</option>
  <option>Interview</option>
  <option>Offer</option>
  <option>Rejected</option>
</select>

<label>Follow-up date</label>
<input id="followUpInput" type="date">

<input id="searchInput" placeholder="Search jobs">

<button onclick="addJob()">Add Job</button>

<div id="jobList"></div>

<script>
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

function saveJobs() {
  localStorage.setItem("jobs", JSON.stringify(jobs));
}

function addJob() {
  const name = document.getElementById("jobInput").value.trim();
  const status = document.getElementById("statusInput").value;
  const followUp = document.getElementById("followUpInput").value;

  if (!name) return;

  jobs.unshift({
    name,
    status,
    date: new Date().toLocaleDateString(),
    followUp
  });

  document.getElementById("jobInput").value = "";
  document.getElementById("statusInput").value = "Applied";
  document.getElementById("followUpInput").value = "";

  saveJobs();
  renderJobs();
}

function renderJobs() {
  const list = document.getElementById("jobList");
  const search = document.getElementById("searchInput").value.toLowerCase().trim();

  list.innerHTML="";

jobs.sort((a, b) => {
  const today = new Date().toISOString().split("T")[0];

  const aOverdue = a.followUp && a.followUp < today;
  const bOverdue = b.followUp && b.followUp < today;

  if (aOverdue && !bOverdue) return -1;
  if (!aOverdue && bOverdue) return 1;

  // rejected last
  if (a.status === "Rejected" && b.status !== "Rejected") return 1;
  if (a.status !== "Rejected" && b.status === "Rejected") return -1;

  return new Date(b.date) - new Date(a.date);
});

const statsDiv = document.getElementById("stats");
const total = jobs.length;
const interviews = jobs.filter(j => j.status === "Interview").length;
const rejected = jobs.filter(j => j.status === "Rejected").length;

statsDiv.innerHTML = `
  Total: ${total} | Interviews: ${interviews} | Rejected: ${rejected}
`;
  jobs.forEach((job, index) => {
    if (!job.name.toLowerCase().includes(search)) return;

const today = new Date().toISOString().split("T")[0];
    
    const isOverdue = job.followUp && job.followUp < today;
const isToday = job.followUp === today;
    const div = document.createElement("div");
    div.className = "job";
if (isOverdue) {
  div.style.backgroundColor = "#ffe6e6";
} else if (isToday) {
  div.style.backgroundColor = "#fff4e6";
}
if (job.status === "Applied") {
  div.style.borderLeft = "6px solid gold";
} else if (job.status === "Interview") {
  div.style.borderLeft = "6px solid blue";
} else if (job.status === "Rejected") {
  div.style.borderLeft = "6px solid red";
}

    div.innerHTML = `
<input value="${job.name}" onchange="updateName(${index}, this.value)" /><br>

Status:
<select onchange="updateStatus(${index}, this.value)">
  <option value="Applied" ${job.status === "Applied" ? "selected" : ""}>Applied</option>
  <option value="Interview" ${job.status === "Interview" ? "selected" : ""}>Interview</option>
  <option value="Offer" ${job.status === "Offer" ? "selected" : ""}>Offer</option>
  <option value="Rejected" ${job.status === "Rejected" ? "selected" : ""}>Rejected</option>
</select><br>

Applied: ${job.date}<br>

<label>Follow up:</label><br>
<input type="date" value="${job.followUp || ""}" onchange="updateFollowUp(${index}, this.value)" /><br>
${isOverdue ? '<span style="color:red">(Overdue)</span><br>' : isToday ? '<span style="color:orange">(Today)</span><br>' : ""}
<button onclick="deleteJob(${index})">Delete</button>
`;
    

    list.appendChild(div);
  });
}

function updateStatus(index, value) {
  jobs[index].status = value;
  saveJobs();
  renderJobs();
} 
function updateName(index, newName) {
  jobs[index].name = newName;
  saveJobs();
  renderJobs();
  }
function deleteJob(index) {
  if (!confirm("Delete this job?")) return;
  jobs.splice(index, 1);
  saveJobs();
  renderJobs();
}

document.getElementById("searchInput").addEventListener("input", renderJobs);

renderJobs();
</script>

</body>
</html>
