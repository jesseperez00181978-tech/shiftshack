<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftStack</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #00f2fe;
  }

  .container {
    max-width: 800px;
    margin: auto;
  }

  input, select, button, textarea {
    width: 100%;
    margin: 5px 0;
    padding: 10px;
    border-radius: 6px;
    border: none;
  }

  button {
    background: #00f2fe;
    color: #000;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    opacity: 0.85;
  }

  .job {
    background: #1a1a1a;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
  }

  .job small {
    color: #aaa;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .delete {
    background: crimson;
    color: white;
    margin-top: 5px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>ShiftStack</h1>

  <input id="company" placeholder="Company name">
  <div class="row">
    <input id="status" placeholder="Status (Applied / Interview / Offer)">
    <input id="date" type="date">
  </div>
  <textarea id="notes" placeholder="Notes"></textarea>

  <button onclick="addJob()">Add Job</button>

  <div id="jobList"></div>
</div>

<script>
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

function save() {
  localStorage.setItem("jobs", JSON.stringify(jobs));
}

function addJob() {
  const company = document.getElementById("company").value;
  const status = document.getElementById("status").value;
  const date = document.getElementById("date").value;
  const notes = document.getElementById("notes").value;

  if (!company) return;

  jobs.push({
    id: Date.now(),
    company,
    status,
    date,
    notes
  });

  save();
  render();

  document.getElementById("company").value = "";
  document.getElementById("status").value = "";
  document.getElementById("date").value = "";
  document.getElementById("notes").value = "";
}

function deleteJob(id) {
  jobs = jobs.filter(job => job.id !== id);
  save();
  render();
}

function render() {
  const list = document.getElementById("jobList");
  list.innerHTML = "";

  jobs.forEach(job => {
    const div = document.createElement("div");
    div.className = "job";

    div.innerHTML = `
      <strong>${job.company}</strong><br>
      <small>Status: ${job.status || "N/A"}</small><br>
      <small>Date: ${job.date || "N/A"}</small><br>
      <p>${job.notes || ""}</p>
      <button class="delete" onclick="deleteJob(${job.id})">Delete</button>
    `;

    list.appendChild(div);
  });
}

render();
</script>

</body>
</html>
