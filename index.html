<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    #stats {
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    .job {
      background: white;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .job select {
      width: auto;
      display: inline-block;
      margin-left: 6px;
    }

    .job button {
      width: auto;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>ShiftStack 💼</h1>

  <div id="stats"></div>

  <input id="jobInput" placeholder="Company name">

  <select id="statusInput">
    <option>Applied</option>
    <option>Interview</option>
    <option>Offer</option>
    <option>Rejected</option>
  </select>

  <label for="followUpInput">Follow-up date</label>
  <input id="followUpInput" type="date" style="background:white;">

  <input id="searchInput" placeholder="Search jobs">

  <button onclick="addJob()">Add Job</button>

  <div id="jobList"></div>

  <script>
    let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

    function saveJobs() {
      localStorage.setItem("jobs", JSON.stringify(jobs));
    }

    function updateStats() {
      const total = jobs.length;
      const interviews = jobs.filter(job => job.status === "Interview").length;
      const offers = jobs.filter(job => job.status === "Offer").length;

      document.getElementById("stats").innerText =
        `Total: ${total} | Interviews: ${interviews} | Offers: ${offers}`;
    }

    function getStatusColor(status) {
      if (status === "Applied") return "gray";
      if (status === "Interview") return "blue";
      if (status === "Offer") return "green";
      if (status === "Rejected") return "darkred";
      return "black";
    }

    function addJob() {
      const input = document.getElementById("jobInput");
      const statusInput = document.getElementById("statusInput");
      const followUpInput = document.getElementById("followUpInput");

      if (!input.value.trim()) return;

      jobs.unshift({
        name: input.value.trim(),
        status: statusInput.value,
        date: new Date().toLocaleDateString(),
        followUp: followUpInput.value || ""
      });

      input.value = "";
      statusInput.value = "Applied";
      followUpInput.value = "";

      saveJobs();
      updateStats();
      renderJobs();
    }

    function renderJobs() {
      const list = document.getElementById("jobList");
      const searchValue = document.getElementById("searchInput").value.toLowerCase();

      list.innerHTML = "";

      jobs.forEach((job, index) => {
        if (!job.name.toLowerCase().includes(searchValue)) return;

        const div = document.createElement("div");
        div.className = "job";

        const today = new Date().toISOString().split("T")[0];
        const isOverdue = job.followUp && job.followUp < today;

        div.innerHTML = `
          <strong>${job.name}</strong><br>
          Status:
          <select 
            onchange="updateStatus(${index}, this.value)" 
            style="color:${getStatusColor(job.status)}"
          >
            <option value="Applied" ${job.status === "Applied" ? "selected" : ""}>Applied</option>
            <option value="Interview" ${job.status === "Interview" ? "selected" : ""}>Interview</option>
            <option value="Offer" ${job.status === "Offer" ? "selected" : ""}>Offer</option>
            <option value="Rejected" ${job.status === "Rejected" ? "selected" : ""}>Rejected</option>
          </select><br>
          Applied: ${job.date}<br>
          ${
            job.followUp
              ? `<span style="color:${isOverdue ? 'red' : 'black'}">
                  Follow up: ${job.followUp} ${isOverdue ? '(Overdue)' : ''}
                </span><br>`
              : ""
          }
          <button onclick="deleteJob(${index})">Delete</button>
        `;

        list.appendChild(div);
      });
    }

    function updateStatus(index, newStatus) {
      jobs[index].status = newStatus;
      saveJobs();
      updateStats();
      renderJobs();
    }

    function deleteJob(index) {
      const confirmed = window.confirm("Are you sure you want to delete this job?");
      if (!confirmed) return;

      jobs.splice(index, 1);
      saveJobs();
      updateStats();
      renderJobs();
    }

    document.getElementById("searchInput").addEventListener("input", renderJobs);

    updateStats();
    renderJobs();
  </script>
</body>
</html>
