<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 { text-align: center; }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { transform: scale(1.03); }

    .job {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .offer { box-shadow: 0 0 25px rgba(0,255,0,0.5); }

    .overdue { background: #ffe5e5; border-left: 6px solid red; }
    .today { background: #fff4cc; border-left: 6px solid orange; }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px red; }
      50% { transform: scale(1.02); box-shadow: 0 0 25px red; }
      100% { transform: scale(1); box-shadow: 0 0 10px red; }
    }
  </style>
</head>

<body>

<h1>ShiftStack 💼</h1>

<button onclick="searchIndeed()">Find Jobs</button>
<button onclick="exportJobs()">Export</button>
<button onclick="backupJobs()">Backup</button>

<input id="jobInput" placeholder="Company name">
<select id="statusInput">
  <option>Applied</option>
  <option>Interview</option>
  <option>Offer</option>
  <option>Rejected</option>
</select>

<input id="followUpInput" type="date">

<input id="searchInput" placeholder="Search jobs" oninput="renderJobs()">

<button onclick="addJob()">Add Job</button>
<button onclick="clearJobs()">Clear All</button>

<div id="jobList"></div>

<script>
let jobs = JSON.parse(localStorage.getItem("jobs") || "[]");

function save() {
  localStorage.setItem("jobs", JSON.stringify(jobs));
}

function addJob() {
  const name = jobInput.value.trim();
  if (!name) return;

  const today = new Date().toISOString().split("T")[0];

  jobs.unshift({
    name,
    status: statusInput.value,
    date: today,
    followUp: followUpInput.value || today,
    notes: "",
    link: "",
    contacted: false
  });

  jobInput.value = "";
  followUpInput.value = "";

  save();
  renderJobs();
}

function renderJobs() {
  const list = document.getElementById("jobList");
  const search = searchInput.value.toLowerCase();

  list.innerHTML = "";

  const today = new Date().toISOString().split("T")[0];

  jobs
    .filter(j => j.name.toLowerCase().includes(search))
    .forEach((job, i) => {

      const div = document.createElement("div");
      div.className = "job";

      const overdue = job.followUp && job.followUp < today;
      const isToday = job.followUp === today;

      if (job.status === "Offer") div.classList.add("offer");
      if (overdue) div.classList.add("overdue");
      if (isToday) div.classList.add("today");

      div.innerHTML = `
        <input value="${job.name}" onchange="updateName(${i}, this.value)">
        
        <select onchange="updateStatus(${i}, this.value)">
          <option ${job.status==="Applied"?"selected":""}>Applied</option>
          <option ${job.status==="Interview"?"selected":""}>Interview</option>
          <option ${job.status==="Offer"?"selected":""}>Offer</option>
          <option ${job.status==="Rejected"?"selected":""}>Rejected</option>
        </select>

        <input type="date" value="${job.followUp || ""}" onchange="updateFollow(${i}, this.value)">

        <textarea onchange="updateNotes(${i}, this.value)">${job.notes || ""}</textarea>

        <button onclick="deleteJob(${i})">Delete</button>
      `;

      list.appendChild(div);
    });
}

function updateName(i,v){ jobs[i].name=v; save(); renderJobs(); }
function updateStatus(i,v){ jobs[i].status=v; save(); renderJobs(); }
function updateFollow(i,v){ jobs[i].followUp=v; save(); renderJobs(); }
function updateNotes(i,v){ jobs[i].notes=v; save(); }

function deleteJob(i){
  jobs.splice(i,1);
  save();
  renderJobs();
}

function clearJobs(){
  if(confirm("Clear everything?")){
    jobs = [];
    save();
    renderJobs();
  }
}

function exportJobs(){
  const blob = new Blob([JSON.stringify(jobs)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shiftstack.json";
  a.click();
}

function backupJobs(){ exportJobs(); }

function searchIndeed(){
  window.open("https://www.indeed.com/jobs?q=" + encodeURIComponent(jobInput.value || "jobs"));
}

renderJobs();
</script>

</body>
</html>
