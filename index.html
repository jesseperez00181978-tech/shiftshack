in<!DOCTYPE html>
<html>
<head>
  <title>ShiftStack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .container {
  max-width: 500px;
  margin: auto;
}

.section {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      text-align: center;
    }
.job button {
  width: auto;
  margin-top: 10px;
}


.import-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #ddd;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
}


    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    } <button onclick="document.getElementById('importFile').click()">
  Import Jobs
</button>

<input type="file" id="importFile" accept=".json,application/json" onchange="importJobs(event)" style="display:none;">
{
      background: white;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .job button {
      width: auto;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>ShiftStack 💼</h1>
  <button onclick="searchIndeed()">Find Jobs</button>
<button id="exportBtn" onclick="exportJobs()">Export Jobs</button>
  <label for="importFile" class="import-btn">Import Jobs</label>
<input type="file" id="importFile" onchange="importJobs(event)">
  <div id="stats" style="margin-bottom: 15px; font-weight: bold;"></div>

<div class="section">
  <label>Follow-up date</label>
  <input id="followUpInput" type="date">
</div>

<div class="section">
  <input id="jobInput" placeholder="Company name">
</div>
  

<div class="section">
  <select id="statusInput">
    <option>Applied</option>
    <option>Interview</option>
    <option>Offer</option>
    <option>Rejected</option>
  </select>
</div>
 <div class="section">
  <label>Follow-up date</label>
  <input id="followUpInput" type="date">
 </div>
  <input id="searchInput" placeholder="Search jobs" oninput="renderJobs()">
<select id="filterStatus" onchange="renderJobs()">
  
    <option value="All">All Statuses</option>
    <option value="Applied">Applied</option>
    <option value="Interview">Interview</option>
    <option value="Offer">Offer</option>
    <option value="Rejected">Rejected</option>
  </select>
<button onclick="addJob()">Add Job</button>
<button onclick="clearJobs()">Clear All</button>
  <p id="jobCount" style="font-size:14px;"></p>
  <div id="jobList"></div>

  <script>
    let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

    function saveJobs() {
      localStorage.setItem("jobs", JSON.stringify(jobs));
    }

    function addJob() {
      const name = document.getElementById("jobInput").value.trim();
      const status = document.getElementById("statusInput").value;
      const followUp = document.getElementById("followUpInput").value;

      if (!name){return;}
document.getElementById("jobInput").value = "";
document.getElementById("followUpInput").value = "";
      jobs.unshift({
  name,
  status,
  date: new Date().toLocaleDateString(),
  followUp,
  notes: ""

});
saveJobs();
renderJobs();
      document.getElementById("jobInput").value = "";
      document.getElementById("followUpInput").value = "";
      document.getElementById("statusInput").value = "Applied";
      

      saveJobs();
      renderJobs();
    }

    function renderJobs() {
      const list = document.getElementById("jobList");
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const filterStatus = document.getElementById("filterStatus").value;
const list = document.getElementById("jobList");
      list.innerHTML = "";

      function renderJobs() {
  const list = document.getElementById("jobList");
  const searchInput = document.getElementById("searchInput");
  const filterStatusInput = document.getElementById("filterStatus");

  if (!list) return;

  const search = searchInput ? searchInput.value.toLowerCase() : "";
  const filterStatus = filterStatusInput ? filterStatusInput.value : "All";

  list.innerHTML = "";

  jobs
    .filter(job => {
      const matchesSearch = (job.name || "").toLowerCase().includes(search);
      const matchesStatus = filterStatus === "All" || job.status === filterStatus;
      return matchesSearch && matchesStatus;
    })
    .forEach((job, index) => {
      const div = document.createElement("div");
      div.className = "job-card";

      let followUpLabel = "";
      if (job.followUp) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const followDate = new Date(job.followUp);
        followDate.setHours(0, 0, 0, 0);

        if (followDate < today) {
          followUpLabel = `<div style="color:red;font-weight:bold;">Overdue</div>`;
        } else if (followDate.getTime() === today.getTime()) {
          followUpLabel = `<div style="color:orange;font-weight:bold;">Due Today</div>`;
        }
      }

      div.innerHTML = `
        <h3>${job.name || ""}</h3>
        <p>Status: ${job.status || "Applied"}</p>
        <p>Applied: ${job.date || ""}</p>
        <p>Follow-up: ${job.followUp || "None"}</p>
        ${followUpLabel}
        <textarea onchange="updateNotes(${index}, this.value)">${job.notes || ""}</textarea>
        <br>
        <button onclick="deleteJob(${index})">Delete</button>
      `;

      list.appendChild(div);
    });
      }

            
        
        });
    }

    function updateStatus(index, value) {
      jobs[index].status = value;
      saveJobs();
      renderJobs();
    }

    function updateName(index, newName) {
      jobs[index].name = newName;
      saveJobs();
      renderJobs();
    }
function updateNotes(index, value) {
  jobs[index].notes = value;
  saveJobs();
  renderJobs();
}
    function updateFollowUp(index, newDate) {
      jobs[index].followUp = newDate;
      saveJobs();
      renderJobs();
    }
function exportJobs() {
  const raw = localStorage.getItem("jobs");

  if (!raw || raw === "[]") {
    alert("No jobs to export");
    return;
  }

  const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(raw);

  const a = document.createElement("a");
  a.href = dataUri;
  a.download = "jobs.json";

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

    function updateName(index, newName) {
  jobs[index].name = newName;
  saveJobs();
  renderJobs();
}
function searchIndeed() {
  const query = document.getElementById("jobInput").value || "jobs";
  const url = `https://www.indeed.com/jobs?q=${encodeURIComponent(query)}`;
  window.open(url, "_blank");
   
} 

    
    

    function deleteJob(index) {
      if (!confirm("Delete this job?")) return;
      jobs.splice(index, 1);
      saveJobs();
      renderJobs();
    }
function clearJobs() {
  if (!confirm("Delete ALL jobs?")) return;
  jobs = [];
  saveJobs();
  renderJobs();
}
    document.getElementById("searchInput").addEventListener("input", renderJobs);
    document.getElementById("filterStatus").addEventListener("change", renderJobs);

    
    function importJobs(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      jobs = JSON.parse(e.target.result);
      saveJobs();
      renderJobs();
    } catch {
      alert("Invalid file");
    }
  };

  reader.readAsText(file);
    }
 renderJobs();
      </script>
</body>
</html>
